services:
  - type: web
    name: biofile-robot-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 300
    envVars:
      - key: PORT
        value: 10000
      - key: HEADLESS
        value: "true"
      - key: GOOGLE_AUTH_MODE
        value: service_account
      - key: GOOGLE_SERVICE_ACCOUNT_FILE
        value: /etc/secrets/google-service-account.json
      - key: RUNTIME_DIR
        value: /tmp/biofile-robot
      - key: GOOGLE_SHEETS_URL
        sync: false
      - key: GOOGLE_SHEETS_HOJA
        value: Hoja 1
      - key: DEFAULT_LOCALIDAD
        sync: false
      - key: DEFAULT_SEDE
        sync: false
      - key: DEFAULT_TIPO_EVALUACION
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: SESSION_TTL_MS
        value: "43200000"

      # Encuesta de experiencia. Los valores reales se configuran únicamente en Render.
      - key: EXPERIENCIA_WEBHOOK_URL
        sync: false
      - key: EXPERIENCIA_WEBHOOK_TOKEN
        sync: false

      # Clave maestra para cifrar las contraseñas de usuarios creados desde el panel.
      # Debe tener mínimo 32 caracteres y mantenerse únicamente en Render.
      - key: BIOFILE_ENCRYPTION_KEY
        sync: false
      - key: BIOFILE_USERS_SHEET
        value: USUARIOS_BIOFILE
      - key: BIOFILE_AUDIT_SHEET
        value: AUDITORIA_BIOFILE

      # SUPERADMIN PRINCIPAL. Los superadmin SOLO se crean desde Render.
      - key: BIOFILE_USER_CRISTIAN
        sync: false
      - key: BIOFILE_PASSWORD_CRISTIAN
        sync: false
      - key: BIOFILE_ROLE_CRISTIAN
        value: superadmin

      # Compatibilidad temporal con el panel anterior. Puede eliminarse después de migrar.
      - key: API_KEY
        sync: false
