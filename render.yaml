services:
  - type: web
    name: biofile-robot-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 300
    envVars:
      - key: PORT
        value: 10000
      - key: HEADLESS
        value: "true"
      - key: GOOGLE_AUTH_MODE
        value: service_account
      - key: GOOGLE_SERVICE_ACCOUNT_FILE
        value: /etc/secrets/google-service-account.json
      - key: RUNTIME_DIR
        value: /tmp/biofile-robot
      - key: GOOGLE_SHEETS_URL
        sync: false
      - key: GOOGLE_SHEETS_HOJA
        value: Hoja 1
      - key: DEFAULT_LOCALIDAD
        sync: false
      - key: DEFAULT_SEDE
        sync: false
      - key: DEFAULT_TIPO_EVALUACION
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: SESSION_TTL_MS
        value: "43200000"

      # Usuarios BIOFILE. Las contraseñas nunca se guardan en GitHub.
      - key: BIOFILE_USER_CRISTIAN
        sync: false
      - key: BIOFILE_PASSWORD_CRISTIAN
        sync: false
      - key: BIOFILE_ROLE_CRISTIAN
        value: admin

      - key: BIOFILE_USER_AURA
        sync: false
      - key: BIOFILE_PASSWORD_AURA
        sync: false

      - key: BIOFILE_USER_LUISA_RIOS
        sync: false
      - key: BIOFILE_PASSWORD_LUISA_RIOS
        sync: false

      - key: BIOFILE_USER_LUISA_BENAVIDES
        sync: false
      - key: BIOFILE_PASSWORD_LUISA_BENAVIDES
        sync: false

      # Se conserva solo para compatibilidad con el panel anterior.
      - key: API_KEY
        sync: false
