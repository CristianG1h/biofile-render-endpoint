name: Validar BIOFILE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  seguridad-y-sintaxis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas de seguridad
        run: npm test
      - name: Instalar motores PDF y OCR
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-spa tesseract-ocr-osd
      - name: Verificar extracción digital y OCR
        run: node scripts/test-file-engines.mjs
      - name: Instalar Chromium de pruebas
        run: npx playwright install --with-deps chromium
      - name: Verificar filas de productos y aislamiento de sesiones
        run: node scripts/test-browser.mjs
